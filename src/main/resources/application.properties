spring.application.name=raizes-do-nordeste
server.port=${PORT:3000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:raizes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
springdoc.api-docs.path=/api-docs.json
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.jackson.default-property-inclusion=non_null
app.jwt.secret=${JWT_SECRET:}
app.jwt.expires-in=${JWT_EXPIRES_IN:8h}
app.jwt.issuer=raizes-do-nordeste
app.jwt.audience=raizes-api
app.seed.enabled=${SEED_ENABLED:true}
