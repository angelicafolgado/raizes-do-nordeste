<text x="40" y="2580" font-family="Arial, sans-serif" font-size="16" fill="#24475a" text-anchor="start" font-weight="400">Cancelamento: somente AGUARDANDO_PAGAMENTO → CANCELADO, com devolução única de estoque e auditoria na mesma transação.</text>
<text x="40" y="2610" font-family="Arial, sans-serif" font-size="16" fill="#24475a" text-anchor="start" font-weight="400">O gateway é local e imediato: TIMEOUT é um resultado simulado, sem espera de rede ou cobrança real.</text>
