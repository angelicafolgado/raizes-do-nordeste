<rect x="175.9" y="1637" width="248.2" height="54" rx="6" fill="white" stroke="white"/>
<text x="300.0" y="1669" font-family="Arial, sans-serif" font-size="16" fill="#24475a" text-anchor="middle" font-weight="400">200 + sucesso, transacaoId,</text>
