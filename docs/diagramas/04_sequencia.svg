<text x="595.0" y="1626" font-family="Arial, sans-serif" font-size="16" fill="#24475a" text-anchor="middle" font-weight="400">Resultado do caso de uso</text>
<path d="M171,1699 L160,1705 L171,1711" fill="none" stroke="#24475a" stroke-width="1.6"/>
